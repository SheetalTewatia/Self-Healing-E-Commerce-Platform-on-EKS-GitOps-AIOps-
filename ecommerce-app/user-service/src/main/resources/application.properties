server.port=8081
spring.application.name=user-service

# ── MongoDB Connection ─────────────────────────────────────────────────────
# Format: mongodb://username:password@host:port/database?authSource=admin
# In docker-compose: host = "mongodb" (container name)
# In Kubernetes:     host = "mongodb" (K8s Service name)
# Locally:           host = "localhost"
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:password@localhost:27017/userdb?authSource=admin}

# Auto-create indexes from @Indexed annotations on model fields
spring.data.mongodb.auto-index-creation=true

# ── MongoDB Query Logging (see every query in logs) ───────────────────────
# Change to DEBUG to see exact MongoDB queries: db.users.find({email: "..."})
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.ecommerce.user=INFO

# ── Actuator (health + prometheus metrics) ────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=user-service
info.app.description=Handles user registration, login, and profile
info.app.database=MongoDB userdb

