server.port=8083
spring.application.name=order-service

# ── MongoDB Connection ─────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:password@localhost:27017/orderdb?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# ── Inter-Service URLs ────────────────────────────────────────────────────
# Order service calls these two services via HTTP (RestTemplate)
# In docker-compose: container names are the hostnames
# In Kubernetes:     K8s Service names are the hostnames
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.ecommerce.order=INFO

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=order-service
info.app.description=Handles order placement. Calls product-service and notification-service.
info.app.database=MongoDB orderdb

