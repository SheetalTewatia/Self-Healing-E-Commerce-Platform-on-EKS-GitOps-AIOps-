server.port=8082
spring.application.name=product-service

# ── MongoDB Connection ─────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:password@localhost:27017/productdb?authSource=admin}
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.ecommerce.product=INFO

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=product-service
info.app.description=Product catalog with seeded demo data
info.app.database=MongoDB productdb

