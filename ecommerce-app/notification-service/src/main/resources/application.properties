server.port=8084
spring.application.name=notification-service

# ── MongoDB Connection ─────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:password@localhost:27017/notificationdb?authSource=admin}
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.com.ecommerce.notification=INFO

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=notification-service
info.app.description=Stores and serves user notifications. Called by order-service.
info.app.database=MongoDB notificationdb

